# P12D.1 protocol frozen before formal 2018Q1-2019Q1 evaluation.
policy_id: p12d-1-selection-power-v1
source_p12d: reports/p12d_artifacts/population_lifecycle.parquet
archive: runs/p08-rolling-2019-q1-v3/ga_archive.jsonl
archive_sha256: 0dd44f144ce30751df5956ce94db2d04944e99dce8c106bc5c46177f0e87b6cb
discovery_quarters: [2017Q1, 2017Q2, 2017Q3, 2017Q4]
formal_quarters: [2018Q1, 2018Q2, 2018Q3, 2018Q4, 2019Q1]
evaluation:
  timeframe: M15
  cost_multipliers: [1.0, 2.0]
  selection_size: 5
  risk_per_trade: 0.005
  max_aggregate_risk: 0.025
  control_replicates: 100
  seed_base: 20261213
  no_reselection: true
  no_forward_predictors: true
  engine: frozen_p08_p09_portfolio_ledger
rules_tested:
  - id: full_population
    definition: all 100000 strategies
  - id: original_pass_benchmark
    definition: original_filter_decision == PASS
  - id: train_pf_100_n100
    definition: training_profit_factor >= 1.00 and training_n_trades >= 100
  - id: train_pf_105_n100
    definition: training_profit_factor >= 1.05 and training_n_trades >= 100
  - id: train_pf_110_n100
    definition: training_profit_factor >= 1.10 and training_n_trades >= 100
  - id: train_exp_positive_n100
    definition: training_expectancy_R > 0 and training_n_trades >= 100
  - id: train_exp_positive_pf105_n100
    definition: training_expectancy_R > 0 and training_profit_factor >= 1.05 and training_n_trades >= 100
  - id: train_return_positive_dd20_n100
    definition: training_return > 0 and training_max_drawdown <= 0.20 and training_n_trades >= 100
  - id: train_pf105_n100_complexity_le2
    definition: training_profit_factor >= 1.05 and training_n_trades >= 100 and complexity <= 2
  - id: train_pf105_n100_long
    definition: training_profit_factor >= 1.05 and training_n_trades >= 100 and direction == LONG
  - id: train_pf105_n100_short
    definition: training_profit_factor >= 1.05 and training_n_trades >= 100 and direction == SHORT
formal_rules: [train_pf_105_n100, train_pf105_n100_long, train_pf105_n100_short]
control:
  universe: full_population
  matched_activity_universe: training_n_trades >= 100
  sampling: uniform_without_replacement
  selection_size: 5
  replicates: 100
  seed_derivation: seed_base + rule_index * 100000 + replicate
holdout_end_exclusive: 2023-01-01
holdout_used: false
